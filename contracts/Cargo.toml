[package]
name = "stellar_contracts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban smart contracts for Stellar Production Template"
repository = "https://github.com/Northbound-Dev/stellar-production-template"
keywords = ["stellar", "soroban", "smart-contract"]
categories = ["blockchain", "cryptography"]

[dependencies]
soroban-sdk = { version = "15.0.0", features = ["testutils"] }

[dev-dependencies]
assert_eq = "1.0.0"

[[test]]
name = "hello_world"
harness = false
